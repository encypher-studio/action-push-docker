name: "Push to docker and tag"
description: "Push to docker and tag with branch name and input tag, defaults to workflow sha. Pushes to {docker_username}/{repo_name}:{branch_name}, {docker_username}/{repo_name}:{input_tag}"
inputs:
  tag:
    description: 'Extra tag to add other than branch name'
    required: true
    default: ${{ github.sha }}
  username:
    description: 'Dockerhub username'
    required: true
  token:
    description: 'Dockerhub token'
    required: true
  context:
    description: "Build's context is the set of files located in the specified PATH or URL"
    required: false
  file:
    description: "Path to the Dockerfile"
    required: false
outputs:
  value:
    description: "The last non-merge commit"
    value: ${{ steps.calculation.outputs.value }}
runs:
  using: "composite"
  steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.username }}
          password: ${{ inputs.token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ${{ inputs.context }}
          tags: ${{ inputs.username }}/${{ github.event.repository.name }}:${{ github.ref_name }}, ${{ inputs.username }}/${{ github.event.repository.name }}:${{ inputs.tag }}
          file: ${{ inputs.file }}
          cache-from: type=gha
          cache-to: type=gha,mode=max